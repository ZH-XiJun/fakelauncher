plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    Properties properties = new Properties()
    InputStream inputStream = project.rootProject.file('keystore.properties').newDataInputStream()
    properties.load(inputStream)

    def keyKeyStoreFile = file(properties.getProperty('keyStoreFile'))
    def keyKeyStorePassword = properties.getProperty('keyStorePassword')
    def keyKeyAlias = properties.getProperty('keyAlias')
    def keyKeyAliasPassword = properties.getProperty('keyAliasPassword')

    signingConfigs {
        debug {
            storeFile keyKeyStoreFile
            storePassword keyKeyStorePassword
            keyAlias keyKeyAlias
            keyPassword keyKeyAliasPassword
        }
    }
    namespace 'com.wtbruh.fakelauncher'
    compileSdk 35
    // 固定 NDK 版本（keyintercept 用它编译；AGP 8.9 默认的 NDK 未安装）
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.wtbruh.fakelauncher"
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName "0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 只编进需要抓取实体按键的 ABI
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // 只用 libc/liblog，不引 STL（否则会把 libc++_shared.so 也打进 APK）
                arguments '-DANDROID_STL=none'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        aidl true
        viewBinding false
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            // keyintercept 是“可执行文件穿 .so 外套”，必须真解压到 nativeLibraryDir
            // 才能被 App 读出并交给 Shizuku 安装；同时别让 AGP 去 strip 它
            useLegacyPackaging = true
            keepDebugSymbols.add('**/libkeyintercept.so')
        }
    }
}

